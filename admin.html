<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStream — Admin Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a25; --border: #252535;
            --text: #ffffff; --text2: #a0a0b0; --text3: #606070; --orange: #FF5500;
            --success: #10B981; --error: #EF4444; --warning: #F59E0B;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .hidden { display: none !important; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--orange); color: white; }
        .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: var(--error); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-small { padding: 5px 10px; font-size: 11px; border-radius: 12px; }
        
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 14px; margin-bottom: 10px; outline: none; }
        
        #authScreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0a0a0f; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-box { background: var(--surface); padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; border: 1px solid var(--border); }
        
        #mainApp { display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
        #mainContent { flex: 1; padding: 25px; overflow-y: auto; }
        
        .admin-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
        .stat-card h3 { font-size: 26px; color: var(--orange); margin-bottom: 5px; }
        
        .settings-group { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .settings-group h3 { font-size: 16px; margin-bottom: 15px; }
        .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

    <!-- Admin Auth Screen -->
    <div id="authScreen">
        <div class="auth-box">
            <h2 style="color:var(--orange); margin-bottom:10px;">Admin Gateway</h2>
            <p style="color:var(--text2); margin-bottom:20px; font-size:13px;">Master Access Verification Required</p>
            <button class="btn btn-primary" onclick="googleSignIn()" style="width:100%; justify-content:center;">Verify Admin Status</button>
        </div>
    </div>

    <!-- Admin App -->
    <div id="mainApp" class="hidden">
        <div id="sidebar">
            <h3 style="color:var(--orange); margin-bottom:25px;">MusicStream Admin</h3>
            <div style="flex:1;"></div>
            <button class="btn btn-secondary" onclick="logout()" style="width:100%; justify-content:center;">🚪 Logout</button>
        </div>

        <div id="mainContent">
            <h2>Control Panel</h2>
            
            <div class="admin-dashboard" style="margin-top:20px;">
                <div class="stat-card"><h3 id="statUsers">0</h3><p style="color:var(--text2); font-size:12px;">Total Users</p></div>
                <div class="stat-card"><h3 id="statTracks">0</h3><p style="color:var(--text2); font-size:12px;">Total Tracks</p></div>
                <div class="stat-card"><h3 id="statPremium">0</h3><p style="color:var(--text2); font-size:12px;">Premium Users</p></div>
            </div>
            
            <div class="settings-group">
                <h3>➕ Add New Track</h3>
                <input type="text" id="trackTitle" placeholder="Song Title">
                <input type="text" id="trackArtist" placeholder="Artist Name">
                <input type="text" id="trackCover" placeholder="Cover Image URL">
                <input type="text" id="trackAudio" placeholder="Archive.org Audio URL">
                <input type="text" id="trackGenre" placeholder="Genre">
                <button class="btn btn-primary" onclick="addTrack()">Add Track</button>
            </div>
            
            <div class="settings-group">
                <h3>📋 All Tracks</h3>
                <div id="adminTracksList"></div>
            </div>
            
            <div class="settings-group">
                <h3>👥 User Management</h3>
                <div id="adminUsersList"></div>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userRef = db.collection('users').doc(user.uid);
                let doc = await userRef.get();
                
                if (!doc.exists || doc.data().role !== 'admin') {
                    await userRef.set({
                        email: user.email,
                        displayName: user.displayName || user.email.split('@')[0],
                        role: 'admin',
                        subscriptionActive: true,
                        trialEnd: '2030-12-31T00:00:00.000Z'
                    }, { merge: true });
                }

                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                loadAdminData();
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        function googleSignIn() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => alert(err.message)); }
        function logout() { auth.signOut(); location.reload(); }

        async function loadAdminData() {
            const usersSnapshot = await db.collection('users').get();
            const tracksSnapshot = await db.collection('tracks').get();
            
            document.getElementById('statUsers').textContent = usersSnapshot.size;
            document.getElementById('statTracks').textContent = tracksSnapshot.size;
            document.getElementById('statPremium').textContent = usersSnapshot.docs.filter(d => d.data().subscriptionActive).length;
            
            document.getElementById('adminTracksList').innerHTML = tracksSnapshot.docs.map(doc => {
                const track = doc.data();
                return `<div class="setting-item">
                        <div><strong>${track.title}</strong> — ${track.artist} ${track.isActive ? '✅' : '❌'}</div>
                        <div>
                            <button class="btn btn-secondary btn-small" onclick="toggleTrack('${doc.id}', ${!track.isActive})">Toggle</button>
                            <button class="btn btn-danger btn-small" onclick="deleteTrack('${doc.id}')">Delete</button>
                        </div>
                    </div>`;
            }).join('');
            
            document.getElementById('adminUsersList').innerHTML = usersSnapshot.docs.map(doc => {
                const user = doc.data();
                return `<div class="setting-item">
                        <div><strong>${user.displayName || user.email}</strong><p style="font-size:11px; color:var(--text3);">${user.email}</p></div>
                        <div>
                            <button class="btn btn-success btn-small" onclick="activatePremium('${doc.id}')">Premium</button>
                            <button class="btn btn-danger btn-small" onclick="removePremium('${doc.id}')">Remove</button>
                        </div>
                    </div>`;
            }).join('');
        }
        
        async function addTrack() {
            const title = document.getElementById('trackTitle').value;
            const artist = document.getElementById('trackArtist').value;
            const coverUrl = document.getElementById('trackCover').value;
            const audioUrl = document.getElementById('trackAudio').value;
            const genre = document.getElementById('trackGenre').value;
            
            if (!title || !artist || !coverUrl || !audioUrl) return alert('Please fill all fields');
            
            await db.collection('tracks').add({ 
                title, artist, coverUrl, audioUrl, 
                genre: genre || 'General', 
                isActive: true, 
                createdAt: firebase.firestore.FieldValue.serverTimestamp() 
            });
            
            alert('Track added successfully!');
            document.getElementById('trackTitle').value = '';
            document.getElementById('trackArtist').value = '';
            document.getElementById('trackCover').value = '';
            document.getElementById('trackAudio').value = '';
            document.getElementById('trackGenre').value = '';
            loadAdminData();
        }
        
        async function toggleTrack(trackId, isActive) { 
            await db.collection('tracks').doc(trackId).update({ isActive }); 
            loadAdminData(); 
        }
        
        async function deleteTrack(trackId) { 
            if (!confirm('Delete this track?')) return; 
            await db.collection('tracks').doc(trackId).delete(); 
            loadAdminData(); 
        }
        
        async function activatePremium(userId) {
            const months = prompt('Premium duration (months):', '1'); 
            if (!months) return;
            const expiry = new Date(Date.now() + parseInt(months) * 30 * 24 * 60 * 60 * 1000).toISOString();
            await db.collection('users').doc(userId).update({ 
                subscriptionActive: true, 
                subscriptionExpiry: expiry, 
                subscriptionPlan: 'manual' 
            });
            alert('Premium activated!'); 
            loadAdminData();
        }
        
        async function removePremium(userId) {
            if (!confirm('Remove premium access & trial?')) return;
            await db.collection('users').doc(userId).update({ 
                subscriptionActive: false, 
                subscriptionExpiry: null,
                trialEnd: '2024-01-01T00:00:00.000Z' 
            });
            alert('Premium and Trial removed!'); 
            loadAdminData();
        }
    </script>
</body>
</html>
