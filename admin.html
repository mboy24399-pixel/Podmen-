<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStream — Admin Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        /* TERA ORIGINAL CSS (Admin ke kaam ka) */
        :root {
            --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a25; --border: #252535;
            --text: #ffffff; --text2: #a0a0b0; --text3: #606070; --cyan: #00E5FF;
            --purple: #8B5CF6; --gradient: linear-gradient(135deg, #00E5FF, #8B5CF6);
            --success: #10B981; --error: #EF4444; --warning: #F59E0B;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        .hidden { display: none !important; }
        
        .btn { padding: 12px 24px; border: none; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
        .btn-primary { background: var(--gradient); color: white; box-shadow: 0 4px 15px rgba(0,229,255,0.3); }
        .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: var(--error); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-small { padding: 6px 12px; font-size: 12px; border-radius: 15px; }
        
        input { width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 14px; margin-bottom: 8px; }
        
        #authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a0a0f, #1a1a2e); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-box { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; border: 1px solid rgba(255,255,255,0.1); }
        
        #mainApp { display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 15px; }
        .sidebar-logo { font-size: 20px; font-weight: 800; margin-bottom: 25px; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 10px; background: rgba(0,229,255,0.1); color: var(--cyan); border: 1px solid rgba(0,229,255,0.2); width: 100%; cursor: pointer; }
        
        #mainContent { flex: 1; padding: 20px; overflow-y: auto; }
        #header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        
        .admin-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
        .stat-card h3 { font-size: 28px; color: var(--cyan); margin-bottom: 5px; }
        .stat-card p { font-size: 13px; color: var(--text2); }
        
        .settings-group { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .settings-group h3 { font-size: 16px; margin-bottom: 15px; }
        .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

    <!-- Admin Auth Screen -->
    <div id="authScreen">
        <div class="auth-box">
            <h1>Admin Gateway</h1>
            <p style="margin-bottom:20px;">Master Access Only</p>
            <button class="btn btn-primary" onclick="googleSignIn()" style="width:100%; justify-content:center;">Verify Admin Status</button>
        </div>
    </div>

    <!-- Admin App -->
    <div id="mainApp" class="hidden">
        <div id="sidebar">
            <div class="sidebar-logo">MusicStream Admin</div>
            <button class="nav-item">🛡️ Dashboard</button>
            <div style="flex:1;"></div>
            <button class="btn btn-secondary" onclick="logout()" style="width:100%;">🚪 Logout</button>
        </div>

        <div id="mainContent">
            <div id="header">
                <h2>Control Panel</h2>
            </div>

            <!-- TERA ORIGINAL ADMIN PANEL CONTENT -->
            <div class="admin-dashboard">
                <div class="stat-card"><h3 id="statUsers">0</h3><p>Total Users</p></div>
                <div class="stat-card"><h3 id="statTracks">0</h3><p>Total Tracks</p></div>
                <div class="stat-card"><h3 id="statPremium">0</h3><p>Premium Users</p></div>
            </div>
            
            <div class="settings-group">
                <h3>➕ Add Track</h3>
                <input type="text" id="trackTitle" placeholder="Song Title">
                <input type="text" id="trackArtist" placeholder="Artist Name">
                <input type="text" id="trackCover" placeholder="Cover Image URL">
                <input type="text" id="trackAudio" placeholder="Archive.org Audio URL">
                <input type="text" id="trackGenre" placeholder="Genre">
                <button class="btn btn-primary" onclick="addTrack()">Add Track</button>
            </div>
            
            <div class="settings-group">
                <h3>📋 All Tracks</h3>
                <div id="adminTracksList"></div>
            </div>
            
            <div class="settings-group">
                <h3>👥 User Management</h3>
                <div id="adminUsersList"></div>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
<script>


        auth.onAuthStateChanged(async (user) => {
    if (user) {
        const userRef = db.collection('users').doc(user.uid);
        let doc = await userRef.get();
        
        if (!doc.exists || doc.data().role !== 'admin') {
            await userRef.set({
                email: user.email,
                displayName: user.displayName || user.email.split('@')[0],
                role: 'admin',
                subscriptionActive: true,
                trialEnd: '2030-12-31T00:00:00.000Z'
            }, { merge: true });
        }

        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        loadAdminData();
    } else {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.add('hidden');
    }
});


        function googleSignIn() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => alert(err.message)); }
        function logout() { auth.signOut(); location.reload(); }

        // TERE ORIGINAL ADMIN FUNCTIONS
        async function loadAdminData() {
            const usersSnapshot = await db.collection('users').get();
            const tracksSnapshot = await db.collection('tracks').get();
            
            document.getElementById('statUsers').textContent = usersSnapshot.size;
            document.getElementById('statTracks').textContent = tracksSnapshot.size;
            document.getElementById('statPremium').textContent = usersSnapshot.docs.filter(d => d.data().subscriptionActive).length;
            
            document.getElementById('adminTracksList').innerHTML = tracksSnapshot.docs.map(doc => {
                const track = doc.data();
                return `<div class="setting-item">
                        <div><strong>${track.title}</strong> — ${track.artist} ${track.isActive ? '✅' : '❌'}</div>
                        <div>
                            <button class="btn btn-secondary btn-small" onclick="toggleTrack('${doc.id}', ${!track.isActive})">Toggle</button>
                            <button class="btn btn-danger btn-small" onclick="deleteTrack('${doc.id}')">Delete</button>
                        </div>
                    </div>`;
            }).join('');
            
            document.getElementById('adminUsersList').innerHTML = usersSnapshot.docs.map(doc => {
                const user = doc.data();
                return `<div class="setting-item">
                        <div><strong>${user.displayName || user.email}</strong><p style="font-size:11px; color:var(--text3);">${user.email}</p><p style="font-size:11px; color:${user.subscriptionActive ? 'var(--success)' : 'var(--text3)'};">${user.subscriptionActive ? 'Premium' : 'Free'}</p></div>
                        <div>
                            <button class="btn btn-success btn-small" onclick="activatePremium('${doc.id}')">Premium</button>
                            <button class="btn btn-danger btn-small" onclick="removePremium('${doc.id}')">Remove</button>
                        </div>
                    </div>`;
            }).join('');
        }
        
        async function addTrack() {
            const title = document.getElementById('trackTitle').value, artist = document.getElementById('trackArtist').value;
            const coverUrl = document.getElementById('trackCover').value, audioUrl = document.getElementById('trackAudio').value;
            const genre = document.getElementById('trackGenre').value;
            if (!title || !artist || !coverUrl || !audioUrl) return alert('Please fill all fields');
            await db.collection('tracks').add({ title, artist, coverUrl, audioUrl, genre: genre || 'General', isActive: true, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            alert('Track added successfully!');
            document.getElementById('trackTitle').value = ''; document.getElementById('trackArtist').value = ''; document.getElementById('trackCover').value = ''; document.getElementById('trackAudio').value = ''; document.getElementById('trackGenre').value = '';
            loadAdminData();
        }
        
        async function toggleTrack(trackId, isActive) { await db.collection('tracks').doc(trackId).update({ isActive }); loadAdminData(); }
        async function deleteTrack(trackId) { if (!confirm('Delete this track?')) return; await db.collection('tracks').doc(trackId).delete(); loadAdminData(); }
        
        async function activatePremium(userId) {
            const months = prompt('Premium duration (months):', '1'); if (!months) return;
            await db.collection('users').doc(userId).update({ subscriptionActive: true, subscriptionExpiry: new Date(Date.now() + parseInt(months) * 30 * 24 * 60 * 60 * 1000).toISOString(), subscriptionPlan: 'manual' });
            alert('Premium activated!'); loadAdminData();
        }
        
        async function removePremium(userId) {
            if (!confirm('Remove premium access?')) return;
            await db.collection('users').doc(userId).update({ subscriptionActive: false, subscriptionExpiry: null });
            alert('Premium removed!'); loadAdminData();
        }
    </script>
</body>
</html>
