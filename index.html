<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStream — Premium Music Streaming</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a25; --border: #252535;
            --text: #ffffff; --text2: #a0a0b0; --text3: #606070; --cyan: #00E5FF;
            --orange: #FF5500; --gradient: linear-gradient(135deg, #FF5500, #FF8800);
            --success: #10B981; --error: #EF4444; --warning: #F59E0B;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        .hidden { display: none !important; }
        
        /* Dark Neumorphic Soft UI Styles */
        .neumorphic-card {
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 8px 8px 16px rgba(0,0,0,0.4), -8px -8px 16px rgba(255,255,255,0.02);
            border: 1px solid var(--border);
        }
        .neumorphic-btn {
            background: var(--surface2);
            border-radius: 50%;
            box-shadow: 4px 4px 8px rgba(0,0,0,0.5), -4px -4px 8px rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .neumorphic-btn:active {
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5), inset -2px -2px 5px rgba(255,255,255,0.03);
        }

        .btn { padding: 12px 24px; border: none; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
        .btn-primary { background: var(--gradient); color: white; box-shadow: 0 4px 15px rgba(255,85,0,0.3); }
        .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
        
        #authScreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(135deg, #0a0a0f, #1a1a2e); display: flex; align-items: center; justify-content: center; z-index: 99999; }
        .auth-box { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; border: 1px solid rgba(255,255,255,0.08); }
        
        #mainApp { display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 15px; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
        .sidebar-logo { font-size: 20px; font-weight: 800; margin-bottom: 25px; color: var(--orange); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 10px; border: none; background: transparent; color: var(--text2); font-size: 14px; cursor: pointer; width: 100%; margin-bottom: 5px; text-align: left; }
        .nav-item.active { background: rgba(255,85,0,0.1); color: var(--orange); border: 1px solid rgba(255,85,0,0.2); }
        
        #mainContent { flex: 1; margin-left: 240px; padding: 20px; overflow-y: auto; padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
        #header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; position: sticky; top: 0; background: rgba(10,10,15,0.9); backdrop-filter: blur(10px); z-index: 50; border-bottom: 1px solid var(--border); }
        
        /* Circular Track Artwork & List View */
        .track-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-top: 15px; }
        .track-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .track-card img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px auto; display: block; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .track-card h4 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-card p { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Strict Z-Index Paywall Lock Overlay */
        #paywall { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: center; z-index: 99999 !important; }
        .paywall-box { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px; text-align: center; max-width: 450px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .pricing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .price-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
        .price-card.featured { border-color: var(--orange); box-shadow: 0 0 20px rgba(255,85,0,0.2); }
        
        /* Player Bar */
        #playerBar { position: fixed; bottom: 0; left: 240px; right: 0; background: rgba(18,18,26,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 15px; z-index: 90; }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div id="authScreen">
        <div class="auth-box">
            <h1>MusicStream</h1>
            <p style="color:var(--text2); margin:15px 0;">God-Level Secure Music Platform</p>
            <button class="btn btn-primary" onclick="googleSignIn()" style="width:100%; justify-content:center;">🔐 Sign In with Google</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden">
        <div id="sidebar">
            <div class="sidebar-logo">🎵 MusicStream</div>
            <button class="nav-item active" onclick="switchPage('home')">🏠 Home</button>
            <button class="nav-item" onclick="switchPage('explore')">🔍 Explore</button>
            <button class="nav-item" onclick="switchPage('playlists')">📂 Playlists</button>
            <button class="nav-item" onclick="switchPage('favorites')">❤️ Favorites</button>
            <div style="flex:1;"></div>
            <button class="nav-item" onclick="logout()">🚪 Logout</button>
        </div>

        <div id="mainContent">
            <div id="header">
                <h2 id="pageTitle">Home</h2>
                <span id="trialBadge" class="badge" style="background:rgba(255,85,0,0.1); color:var(--orange); padding:6px 12px; border-radius:15px; font-size:12px;">Checking Trial...</span>
            </div>

            <div id="homePage" class="page">
                <h3>Trending Tracks</h3>
                <div id="trackGrid" class="track-grid"></div>
            </div>
            
            <div id="explorePage" class="page hidden">
                <input type="text" id="searchInput" placeholder="Search songs..." oninput="searchTracks(this.value)" style="padding:12px; border-radius:10px; background:var(--surface); border:1px solid var(--border); color:white; width:100%;">
                <div id="searchResults" class="track-grid"></div>
            </div>
            <div id="playlistsPage" class="page hidden"><h3>Playlists</h3></div>
            <div id="favoritesPage" class="page hidden"><h3>Favorites</h3></div>
        </div>

        <!-- Strict Paywall Lock Overlay -->
        <div id="paywall" class="hidden">
            <div class="paywall-box">
                <h2>🔒 Premium Required</h2>
                <p style="color:var(--text2); margin:10px 0;">Your free trial has ended. Secure subscription needed to continue.</p>
                <div class="pricing-grid">
                    <div class="price-card">
                        <h4>Monthly</h4>
                        <div style="font-size:22px; font-weight:bold; margin:10px 0;">₹99</div>
                        <button class="btn btn-primary btn-small" onclick="openPayment('monthly')">Choose</button>
                    </div>
                    <div class="price-card featured">
                        <h4>Yearly ⭐</h4>
                        <div style="font-size:22px; font-weight:bold; margin:10px 0;">₹999</div>
                        <button class="btn btn-primary btn-small" onclick="openPayment('yearly')">Choose</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Player Bar -->
        <div id="playerBar" class="hidden">
            <span id="playerTitle" style="font-size:13px; font-weight:600;">Select Track</span>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        let currentUser = null, userData = null, tracks = [], currentTrack = null, audio = new Audio();

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                
                const userDocRef = db.collection('users').doc(user.uid);
                const doc = await userDocRef.get();
                if (!doc.exists) {
                    const trialEnd = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString();
                    await userDocRef.set({
                        email: user.email,
                        displayName: user.displayName || user.email.split('@')[0],
                        role: 'user',
                        subscriptionActive: false,
                        trialEnd: trialEnd,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                
                userDocRef.onSnapshot((docSnap) => {
                    if(docSnap.exists) {
                        userData = docSnap.data();
                        enforceEntitlement();
                    }
                });
                loadTracks();
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        function googleSignIn() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => alert(err.message)); }
        function logout() { auth.signOut(); location.reload(); }

        function enforceEntitlement() {
            if (!userData) return;
            const now = new Date();
            const trialEnd = new Date(userData.trialEnd);
            const paywall = document.getElementById('paywall');
            const trialBadge = document.getElementById('trialBadge');

            if (userData.subscriptionActive) {
                paywall.classList.add('hidden');
                trialBadge.textContent = "👑 Premium Active";
            } else if (now < trialEnd) {
                paywall.classList.add('hidden');
                const daysLeft = Math.ceil((trialEnd - now) / (1000 * 60 * 60 * 24));
                trialBadge.textContent = `Trial: ${daysLeft} days left`;
            } else {
                paywall.classList.remove('hidden');
                trialBadge.textContent = "⚠️ Trial Expired";
                if (!audio.paused) audio.pause();
            }
        }

        async function loadTracks() {
            db.collection('tracks').where('isActive', '==', true).onSnapshot(snapshot => {
                tracks = [];
                snapshot.forEach(doc => tracks.push({ id: doc.id, ...doc.data() }));
                renderTracks();
            });
        }

        function renderTracks() {
            const grid = document.getElementById('trackGrid');
            if(tracks.length === 0) { grid.innerHTML = "<p style='color:var(--text3);'>No tracks found.</p>"; return; }
            grid.innerHTML = tracks.map((t, idx) => `
                <div class="track-card" onclick="playTrack(${idx})">
                    <img src="${t.coverUrl}" onerror="this.src='https://via.placeholder.com/150'">
                    <h4>${t.title}</h4>
                    <p>${t.artist}</p>
                </div>
            `).join('');
        }

        function playTrack(idx) {
            if (!userData.subscriptionActive && new Date() > new Date(userData.trialEnd)) {
                document.getElementById('paywall').classList.remove('hidden');
                return;
            }
            currentTrack = tracks[idx];
            audio.src = currentTrack.audioUrl;
            audio.play();
            document.getElementById('playerBar').classList.remove('hidden');
            document.getElementById('playerTitle').textContent = `${currentTrack.title} — ${currentTrack.artist}`;
        }

        function openPayment(plan) {
            window.open(PAYMENT_LINKS[plan], '_blank');
        }

        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(page + 'Page').classList.remove('hidden');
            document.getElementById('pageTitle').textContent = page.charAt(0).toUpperCase() + page.slice(1);
        }
    </script>
</body>
</html>
